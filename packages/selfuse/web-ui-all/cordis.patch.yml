# Self-use Web composition: keep only distinct custom browser capabilities.
# Rows are namespaced web-ui-* to avoid colliding with standalone installs.

# from self
- insert:
    - id: web-ui-compat
      name: '@dsh-selfuse/web-ui-all'

# from ../dsh-git-graph
- insert:
    - id: web-ui-git-graph
      name: '@dsh-selfuse/web-ui-git-graph'

# from ../dsh-remote-web-ui
- insert:
    - id: web-ui-remote-web-ui
      name: '@dsh-selfuse/remote-web-ui'

# from ../skins/skin-center
- insert:
    - id: web-ui-skin-center
      name: '@dsh-selfuse/skin-center'
