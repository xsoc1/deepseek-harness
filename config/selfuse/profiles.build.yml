# dsh-selfuse single profile manifest
# The generator (scripts/selfuse/generate-profile.mjs) turns this into
# ~/.dsh/profiles/<name>/package.json, cordis.patch.yml and optionally
# installs skills / settings overlays.
# bundles: packages that declare dsh.bundle; resolved from the dsh installation
# (apps/cli) first, then from the profile directory.
# patchPlugins: ordinary Cordis plugins mounted through the profile patch layer.
name: web
bundles:
  - "@deepseek-ai/dsh-base"
  - "@deepseek-ai/dsh-web-app"
  - "@dsh-selfuse/web-ui-all"
  - "@dsh-selfuse/backup"
  - "@dsh-selfuse/git-workflow"
  - "@dsh-selfuse/wsl-workspace"
  - "@dsh-selfuse/memory-panel"
patchPlugins:
  - "@deepseek-ai/dsh-task-notify"
  - "@dsh-selfuse/soul-md"
  - "@dsh-selfuse/content-risk-guard"
# Browser-only rows inherited from the official Web bundle that this personal
# profile deliberately leaves inactive. Keep this list by stable Cordis row id
# so upstream package updates remain mergeable.
disabledRows:
  # The official document preview eagerly embeds PDF.js, its Worker, CMaps,
  # fonts, and WASM into startup. It contributes ~3.25 MiB of the compressed
  # cold boot even when no document is opened, which is unsuitable over the
  # lossy iPad/Tailnet path. Files and the right Sidebar remain available.
  - ui-sidebar-documentpreview
# Configuration overrides for inherited official rows. Keep the remote mux at
# the official ten-second cadence: its thirty-second application deadline
# tolerates mobile Tailnet path changes without allowing an infinite half-open
# browser stream.
rowConfigs:
  typert-gateway:
    websocketHeartbeatIntervalMs: 10000
  furongjun1999-dsh-memory:
    python: /usr/bin/python3
    roleplayWebEnabled: false
    mdcg:
      enabled: true
      root: /home/huangzy/.dsh/lingshu/mdcg
      actor: dsh-memory
      tenant: default
      clearance: internal
skills:
  - math-research-dsh
  - mattpocock-skills
  - obsidian-skills
