# dsh-selfuse single profile manifest
# The generator (scripts/selfuse/generate-profile.mjs) turns this into
# ~/.dsh/profiles/<name>/package.json, cordis.patch.yml and optionally
# installs skills / settings overlays.
# bundles: packages that declare dsh.bundle; resolved from the dsh installation
# (apps/cli) first, then from the profile directory.
# patchPlugins: ordinary Cordis plugins mounted through the profile patch layer.
name: web
bundles:
  - "@deepseek-ai/dsh-base"
  - "@deepseek-ai/dsh-web-app"
  - "@dsh-selfuse/web-ui-all"
  - "@dsh-selfuse/market"
  - "@dsh-selfuse/mineru"
  - "@dsh-selfuse/backup"
  - "@dsh-selfuse/git-workflow"
  - "@dsh-selfuse/file-upload"
  - "@dsh-selfuse/undo"
  - "@dsh-selfuse/wsl-workspace"
  - "@dsh-selfuse/memory-panel"
patchPlugins:
  - "@dsh-selfuse/skill-router"
skills:
  - math-research-dsh
  - mattpocock-skills
  - obsidian-skills
